@media(prefers-color-scheme:dark){:root{--bg:#0e1716;--panel:#15211f;--ink:#dcebe7;--mute:#8fa8a3;--acc:#4fd1c0;--line:#27403b;--code:#091211;--codeink:#cfe7e2;--outbg:#112925;--outink:#9be8d9}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Georgia,"Times New Roman",serif}
header{padding:2.2rem 1.5rem 1.4rem;border-bottom:1px solid var(--line)}

.wrap{display:flex;gap:1.5rem;max-width:1200px;margin:0 auto;padding:1.2rem}
nav{position:sticky;top:1rem;align-self:flex-start;width:230px;flex:none;max-height:92vh;overflow:auto;font:14px system-ui,sans-serif}

const D=[{"n": 1, "week": "Week 1", "q": "Write a C program that contains a string (char pointer) with a value 'Hello World'. The program should XOR each character in this string with 0 and display the result.", "lang": "C", "file": "w1.c", "code": "#include <stdio.h>\n#include <string.h>\n\nint main() {\n    char *str = \"Hello World\";\n    int len = strlen(str);\n    for (int i = 0; i < len; i++)\n        printf(\"%c\", str[i] ^ 0);\n    printf(\"\\n\");\n    return 0;\n}", "out": "Hello World"}, {"n": 2, "week": "Week 2", "q": "Write a C program that contains a string (char pointer) with a value 'Hello World'. The program should AND or and XOR each character in this string with 127 and display the result.", "lang": "C", "file": "w2.c", "code": "#include <stdio.h>\n#include <string.h>\n\nint main() {\n    char *str = \"Hello World\";\n    int len = strlen(str);\n    printf(\"AND with 127: \");\n    for (int i = 0; i < len; i++)\n        printf(\"%c\", str[i] & 127);\n    printf(\"\\nXOR with 127 (ASCII codes): \");\n    for (int i = 0; i < len; i++)\n        printf(\"%d \", str[i] ^ 127);\n    printf(\"\\n\");\n    return 0;\n}", "out": "AND with 127: Hello World\nXOR with 127 (ASCII codes): 55 26 19 19 16 95 40 16 13 19 27\n(XOR with 127 flips the low 7 bits, giving control characters, so the codes are printed as numbers.)"}, {"n": 3, "week": "Week 3 (a)", "q": "Write a Java program to perform encryption and decryption using the following algorithms: a) Caesar Cipher", "lang": "Java", "file": "CaesarCipher.java", "code": "import java.util.Scanner;\n\npublic class CaesarCipher {\n    static String shift(String s, int key) {\n        StringBuilder sb = new StringBuilder();\n        for (char c : s.toCharArray()) {\n            if (Character.isUpperCase(c))\n                sb.append((char) ('A' + ((c - 'A' + key) % 26 + 26) % 26));\n            else if (Character.isLowerCase(c))\n                sb.append((char) ('a' + ((c - 'a' + key) % 26 + 26) % 26));\n            else sb.append(c);\n        }\n        return sb.toString();\n    }\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        System.out.print(\"Enter any String: \");\n        String str = sc.nextLine();\n        System.out.print(\"Enter the Key: \");\n        int key = sc.nextInt();\n        String enc = shift(str, key);\n        System.out.println(\"Encrypted String is: \" + enc);\n        System.out.println(\"Decrypted String is: \" + shift(enc, -key));\n    }\n}", "out": "Enter any String: Hello World\nEnter the Key: 5\nEncrypted String is: Mjqqt Btwqi\nDecrypted String is: Hello World"}, {"n": 3, "week": "Week 3 (b)", "q": "b) Substitution Cipher", "lang": "Java", "file": "SubstitutionCipher.java", "code": "import java.util.Scanner;\n\npublic class SubstitutionCipher {\n    static String a = \"abcdefghijklmnopqrstuvwxyz\";\n    static String b = \"zyxwvutsrqponmlkjihgfedcba\";\n\n    static String map(String s, String from, String to) {\n        StringBuilder sb = new StringBuilder();\n        for (char c : s.toCharArray()) {\n            int j = from.indexOf(c);\n            sb.append(j >= 0 ? to.charAt(j) : c);\n        }\n        return sb.toString();\n    }\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        System.out.print(\"Enter any string: \");\n        String str = sc.nextLine();\n        String enc = map(str, a, b);\n        System.out.println(\"The encrypted data is: \" + enc);\n        System.out.println(\"The decrypted data is: \" + map(enc, b, a));\n    }\n}", "out": "Enter any string: aceho\nThe encrypted data is: zxvsl\nThe decrypted data is: aceho"}, {"n": 3, "week": "Week 3 (c)", "q": "c) Hill Cipher", "lang": "Java", "file": "HillCipher.java", "code": "import java.util.Scanner;\n\npublic class HillCipher {\n    static int mod(int x) { return ((x % 26) + 26) % 26; }\n\n    static int[] multiply(int[][] k, int[] v) {\n        int[] r = new int[3];\n        for (int i = 0; i < 3; i++)\n            for (int j = 0; j < 3; j++) r[i] += k[i][j] * v[j];\n        for (int i = 0; i < 3; i++) r[i] = mod(r[i]);\n        return r;\n    }\n    static int cof(int[][] k, int r, int c) {\n        int r1 = (r + 1) % 3, r2 = (r + 2) % 3, c1 = (c + 1) % 3, c2 = (c + 2) % 3;\n        return k[r1][c1] * k[r2][c2] - k[r1][c2] * k[r2][c1];\n    }\n    static int[][] inverse(int[][] k) {\n        int det = 0;\n        for (int j = 0; j < 3; j++) det += k[0][j] * cof(k, 0, j);\n        det = mod(det);\n        int di = -1;\n        for (int x = 1; x < 26; x++) if (mod(det * x) == 1) di = x;\n        if (di == -1) throw new RuntimeException(\"Key matrix is not invertible mod 26\");\n        int[][] inv = new int[3][3];\n        for (int i = 0; i < 3; i++)\n            for (int j = 0; j < 3; j++) inv[i][j] = mod(di * cof(k, j, i));\n        return inv;\n    }\n    static String text(int[] v) {\n        StringBuilder sb = new StringBuilder();\n        for (int x : v) sb.append((char) (x + 'a'));\n        return sb.toString();\n    }\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        int[][] key = new int[3][3];\n        System.out.println(\"Enter 3x3 key matrix (must be invertible mod 26):\");\n        for (int i = 0; i < 3; i++)\n            for (int j = 0; j < 3; j++) key[i][j] = sc.nextInt();\n        System.out.print(\"Enter a 3 letter string: \");\n        String msg = sc.next().toLowerCase();\n        int[] m = new int[3];\n        for (int i = 0; i < 3; i++) m[i] = msg.charAt(i) - 'a';\n        int[] enc = multiply(key, m);\n        System.out.println(\"Encrypted string is: \" + text(enc));\n        int[][] inv = inverse(key);\n        System.out.println(\"Inverse matrix (mod 26) is:\");\n        for (int[] row : inv) System.out.println(row[0] + \" \" + row[1] + \" \" + row[2]);\n        System.out.println(\"Decrypted string is: \" + text(multiply(inv, enc)));\n    }\n}", "out": "Enter 3x3 key matrix (must be invertible mod 26):\n6 24 1\n13 16 10\n20 17 15\nEnter a 3 letter string: hai\nEncrypted string is: ypa\nInverse matrix (mod 26) is:\n8 5 10\n21 8 21\n21 12 8\nDecrypted string is: hai"}, {"n": 4, "week": "Week 4", "q": "Write a Java program to implement the DES algorithm logic.", "lang": "Java", "file": "DES.java", "code": "import java.util.Base64;\nimport java.util.Scanner;\nimport javax.crypto.Cipher;\nimport javax.crypto.SecretKey;\nimport javax.crypto.SecretKeyFactory;\nimport javax.crypto.spec.DESedeKeySpec;\n\npublic class DES {\n    private final Cipher cipher;\n    private final SecretKey key;\n\n    public DES() throws Exception {\n        byte[] keyBytes = \"ThisIsSecretEncryptionKey\".getBytes(\"UTF8\");\n        key = SecretKeyFactory.getInstance(\"DESede\").generateSecret(new DESedeKeySpec(keyBytes));\n        cipher = Cipher.getInstance(\"DESede\");\n    }\n    public String encrypt(String plain) throws Exception {\n        cipher.init(Cipher.ENCRYPT_MODE, key);\n        return Base64.getEncoder().encodeToString(cipher.doFinal(plain.getBytes(\"UTF8\")));\n    }\n    public String decrypt(String enc) throws Exception {\n        cipher.init(Cipher.DECRYPT_MODE, key);\n        return new String(cipher.doFinal(Base64.getDecoder().decode(enc)), \"UTF8\");\n    }\n    public static void main(String[] args) throws Exception {\n        System.out.print(\"Enter the string: \");\n        String s = new Scanner(System.in).nextLine();\n        DES des = new DES();\n        String enc = des.encrypt(s);\n        System.out.println(\"String To Encrypt: \" + s);\n        System.out.println(\"Encrypted Value : \" + enc);\n        System.out.println(\"Decrypted Value : \" + des.decrypt(enc));\n    }\n}", "out": "Enter the string: Welcome\nString To Encrypt: Welcome\nEncrypted Value : BPQMwc0wKvg=\nDecrypted Value : Welcome"}, {"n": 5, "week": "Week 5", "q": "Write a C/JAVA program to implement the Blowfish algorithm logic.", "lang": "Java", "file": "BlowFish.java", "code": "import java.io.*;\nimport java.util.Base64;\nimport javax.crypto.*;\n\npublic class BlowFish {\n    public static void main(String[] args) throws Exception {\n        try (FileWriter w = new FileWriter(\"inputFile.txt\")) { w.write(\"Hello World\"); }\n\n        KeyGenerator kg = KeyGenerator.getInstance(\"Blowfish\");\n        kg.init(128);\n        SecretKey secretKey = kg.generateKey();\n\n        Cipher cipherOut = Cipher.getInstance(\"Blowfish/CFB/NoPadding\");\n        cipherOut.init(Cipher.ENCRYPT_MODE, secretKey);\n        System.out.println(\"Initialization Vector of the Cipher: \"\n                + Base64.getEncoder().encodeToString(cipherOut.getIV()));\n\n        try (FileInputStream fin = new FileInputStream(\"inputFile.txt\");\n             CipherOutputStream cout = new CipherOutputStream(new FileOutputStream(\"outputFile.txt\"), cipherOut)) {\n            int b;\n            while ((b = fin.read()) != -1) cout.write(b);\n        }\n        System.out.println(\"Contents of inputFile.txt: Hello World\");\n        byte[] out = new FileInputStream(\"outputFile.txt\").readAllBytes();\n        StringBuilder hex = new StringBuilder();\n        for (byte x : out) hex.append(String.format(\"%02x\", x));\n        System.out.println(\"Contents of outputFile.txt (hex): \" + hex);\n    }\n}", "out": "Initialization Vector of the Cipher: 3wrNlYZa3So=\nContents of inputFile.txt: Hello World\nContents of outputFile.txt (hex): c5e3e0471b176f915a6792\n(The key and IV are random, so these values change on every run.)"}, {"n": 6, "week": "Week 6", "q": "Write a C/JAVA program to implement the Rijndael (AES) algorithm logic.", "lang": "Java", "file": "AES.java", "code": "import javax.crypto.*;\nimport javax.crypto.spec.SecretKeySpec;\n\npublic class AES {\n    static String asHex(byte[] buf) {\n        StringBuilder sb = new StringBuilder();\n        for (byte b : buf) sb.append(String.format(\"%02x\", b & 0xff));\n        return sb.toString();\n    }\n    public static void main(String[] args) throws Exception {\n        String message = args.length == 0 ? \"Hello KGRCET\" : args[0];\n        KeyGenerator kgen = KeyGenerator.getInstance(\"AES\");\n        kgen.init(128);\n        SecretKeySpec spec = new SecretKeySpec(kgen.generateKey().getEncoded(), \"AES\");\n\n        Cipher cipher = Cipher.getInstance(\"AES\");\n        cipher.init(Cipher.ENCRYPT_MODE, spec);\n        byte[] encrypted = cipher.doFinal(message.getBytes());\n        System.out.println(\"Input your message: \" + message);\n        System.out.println(\"Encrypted text: \" + asHex(encrypted));\n\n        cipher.init(Cipher.DECRYPT_MODE, spec);\n        System.out.println(\"Decrypted text: \" + new String(cipher.doFinal(encrypted)));\n    }\n}", "out": "Input your message: Hello KGRCET\nEncrypted text: 8f302b5e924544705ba5365feff1eb93\nDecrypted text: Hello KGRCET\n(The key is random, so the encrypted text changes on every run.)"}, {"n": 7, "week": "Week 7", "q": "Write the RC4 logic in Java using Java Cryptography; encrypt the text 'Hello world' using Blowfish. Create your own key using the Java key generator.", "lang": "Java", "file": "BlowFishCipher.java", "code": "import java.util.Scanner;\nimport javax.crypto.*;\n\npublic class BlowFishCipher {\n    public static void main(String[] args) throws Exception {\n        KeyGenerator keygenerator = KeyGenerator.getInstance(\"Blowfish\");\n        SecretKey secretkey = keygenerator.generateKey();\n        Cipher cipher = Cipher.getInstance(\"Blowfish\");\n\n        System.out.print(\"Input your message: \");\n        String inputText = new Scanner(System.in).nextLine();\n\n        cipher.init(Cipher.ENCRYPT_MODE, secretkey);\n        byte[] encrypted = cipher.doFinal(inputText.getBytes());\n        StringBuilder hex = new StringBuilder();\n        for (byte b : encrypted) hex.append(String.format(\"%02x\", b));\n        System.out.println(\"Encrypted text (hex): \" + hex);\n\n        cipher.init(Cipher.DECRYPT_MODE, secretkey);\n        System.out.println(\"Decrypted text: \" + new String(cipher.doFinal(encrypted)));\n    }\n}", "out": "Input your message: Hello world\nEncrypted text (hex): 38cc950744eb4056076827039cdb9288\nDecrypted text: Hello world\n(Random key: the encrypted text changes on every run.)"}, {"n": 8, "week": "Week 8", "q": "Write a Java program to implement the RSA algorithm.", "lang": "Java", "file": "RSA.java", "code": "import java.math.BigInteger;\nimport java.util.Scanner;\n\npublic class RSA {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        System.out.print(\"Enter a Prime number: \");\n        BigInteger p = sc.nextBigInteger();\n        System.out.print(\"Enter another prime number: \");\n        BigInteger q = sc.nextBigInteger();\n\n        BigInteger n = p.multiply(q);\n        BigInteger phi = p.subtract(BigInteger.ONE).multiply(q.subtract(BigInteger.ONE));\n\n        BigInteger e = BigInteger.valueOf(3);\n        while (!phi.gcd(e).equals(BigInteger.ONE)) e = e.add(BigInteger.ONE);\n        BigInteger d = e.modInverse(phi);\n\n        System.out.println(\"Encryption keys are: \" + e + \", \" + n);\n        System.out.println(\"Decryption keys are: \" + d + \", \" + n);\n\n        BigInteger m = BigInteger.valueOf(7);\n        BigInteger c = m.modPow(e, n);\n        System.out.println(\"Test: message 7 -> cipher \" + c + \" -> decrypted \" + c.modPow(d, n));\n    }\n}", "out": "Enter a Prime number: 5\nEnter another prime number: 11\nEncryption keys are: 3, 55\nDecryption keys are: 27, 55\nTest: message 7 -> cipher 13 -> decrypted 7"}, {"n": 9, "week": "Week 9", "q": "Implement the Diffie-Hellman key exchange mechanism using HTML and JavaScript. Consider the end user as one of the parties (Alice) and the JavaScript application as the other party (Bob).", "lang": "HTML + JavaScript", "file": "diffie_hellman.html", "code": "<!DOCTYPE html>\n<html>\n<body>\n<h3>Diffie-Hellman Key Exchange (You = Alice, JavaScript = Bob)<\/h3>\np = <input id=\"p\" value=\"23\" size=\"5\"> g = <input id=\"g\" value=\"5\" size=\"5\">\nYour secret a = <input id=\"a\" value=\"6\" size=\"5\">\n<button onclick=\"run()\">Exchange keys<\/button>\n<pre id=\"out\"><\/pre>\n<script>\nfunction modPow(b, e, m) {\n  let r = 1n; b %= m;\n  while (e > 0n) { if (e & 1n) r = (r * b) % m; b = (b * b) % m; e >>= 1n; }\n  return r;\n}\nfunction run() {\n  const p = BigInt(document.getElementById(\"p\").value);\n  const g = BigInt(document.getElementById(\"g\").value);\n  const a = BigInt(document.getElementById(\"a\").value);          // Alice (user)\n  const b = BigInt(Math.floor(Math.random() * 20) + 2);          // Bob (JavaScript)\n  const A = modPow(g, a, p), B = modPow(g, b, p);                // public values\n  const sa = modPow(B, a, p), sb = modPow(A, b, p);              // shared secrets\n  document.getElementById(\"out\").textContent =\n    \"Alice public A = \" + A + \"\\nBob secret b = \" + b + \"\\nBob public B = \" + B +\n    \"\\nAlice shared key = \" + sa + \"\\nBob shared key   = \" + sb +\n    \"\\nKeys match: \" + (sa === sb);\n}\n<\/script>\n<\/body>\n<\/html>", "out": "Alice public A = 8\nBob secret b = 15\nBob public B = 19\nAlice shared key = 2\nBob shared key   = 2\nKeys match: true\n(p=23, g=5, a=6; Bob's secret is random.)"}, {"n": 10, "week": "Week 10", "q": "Calculate the message digest of a text using the SHA-1 algorithm in JAVA.", "lang": "Java", "file": "SHA1.java", "code": "import java.security.MessageDigest;\n\npublic class SHA1 {\n    public static void main(String[] a) throws Exception {\n        MessageDigest md = MessageDigest.getInstance(\"SHA-1\");\n        System.out.println(\"Message digest object info:\");\n        System.out.println(\"  Algorithm = \" + md.getAlgorithm());\n        System.out.println(\"  Provider  = \" + md.getProvider());\n        for (String input : new String[]{\"\", \"abc\", \"abcdefghijklmnopqrstuvwxyz\"}) {\n            byte[] output = md.digest(input.getBytes());   // digest() also resets md\n            System.out.println(\"SHA1(\\\"\" + input + \"\\\") = \" + bytesToHex(output));\n        }\n    }\n    public static String bytesToHex(byte[] b) {\n        StringBuilder sb = new StringBuilder();\n        for (byte x : b) sb.append(String.format(\"%02X\", x));\n        return sb.toString();\n    }\n}", "out": "Message digest object info:\n  Algorithm = SHA-1\n  Provider  = SUN version 21\nSHA1(\"\") = DA39A3EE5E6B4B0D3255BFEF95601890AFD80709\nSHA1(\"abc\") = A9993E364706816ABA3E25717850C26C9CD0D89D\nSHA1(\"abcdefghijklmnopqrstuvwxyz\") = 32D10C7B8CF96570CA04CE37F2A19D84240D3A89"}, {"n": 11, "week": "Week 11 / 12", "q": "Calculate the message digest of a text using the MD5 algorithm in JAVA.", "lang": "Java", "file": "MD5.java", "code": "import java.security.MessageDigest;\n\npublic class MD5 {\n    public static void main(String[] a) throws Exception {\n        MessageDigest md = MessageDigest.getInstance(\"MD5\");\n        System.out.println(\"Message digest object info:\");\n        System.out.println(\"  Algorithm = \" + md.getAlgorithm());\n        System.out.println(\"  Provider  = \" + md.getProvider());\n        for (String input : new String[]{\"\", \"abc\", \"abcdefghijklmnopqrstuvwxyz\"}) {\n            byte[] output = md.digest(input.getBytes());   // digest() also resets md\n            System.out.println(\"MD5(\\\"\" + input + \"\\\") = \" + bytesToHex(output));\n        }\n    }\n    public static String bytesToHex(byte[] b) {\n        StringBuilder sb = new StringBuilder();\n        for (byte x : b) sb.append(String.format(\"%02X\", x));\n        return sb.toString();\n    }\n}", "out": "Message digest object info:\n  Algorithm = MD5\n  Provider  = SUN version 21\nMD5(\"\") = D41D8CD98F00B204E9800998ECF8427E\nMD5(\"abc\") = 900150983CD24FB0D6963F7D28E17F72\nMD5(\"abcdefghijklmnopqrstuvwxyz\") = C3FCD3D76192E4007DFB496CCA67E13B"}, {"n": 12, "week": "Additional Program", "q": "Implement the RC4 stream cipher in Java using the Key-Scheduling Algorithm (KSA) and Pseudo-Random Generation Algorithm (PRGA). Encrypt and decrypt the text \"Hello, World!\" using the key \"MySecretKey\".", "lang": "Java", "file": "RC4Cipher.java", "code": "import java.nio.charset.StandardCharsets;\n\npublic class RC4Cipher {\n\n    /**\n     * Key-Scheduling Algorithm (KSA)\n     * Initializes and scrambles the 256-byte S-box based on the secret key.\n     */\n    private static int[] ksa(byte[] key) {\n        int[] S = new int[256];\n        \n        // Initialize S-box with values 0 to 255\n        for (int i = 0; i < 256; i++) {\n            S[i] = i;\n        }\n\n        int j = 0;\n        for (int i = 0; i < 256; i++) {\n            // Using & 0xFF to handle Java's signed bytes as unsigned integers\n            int keyByte = key[i % key.length] & 0xFF; \n            j = (j + S[i] + keyByte) % 256;\n            \n            // Swap values\n            int temp = S[i];\n            S[i] = S[j];\n            S[j] = temp;\n        }\n        return S;\n    }\n\n    /**\n     * Encrypts or decrypts the input data using the RC4 algorithm.\n     */\n    public static byte[] rc4(byte[] key, byte[] data) {\n        int[] S = ksa(key);\n        byte[] result = new byte[data.length];\n        \n        int i = 0;\n        int j = 0;\n\n        // Pseudo-Random Generation Algorithm (PRGA) & XOR Phase\n        for (int k = 0; k < data.length; k++) {\n            i = (i + 1) % 256;\n            j = (j + S[i]) % 256;\n\n            // Swap values\n            int temp = S[i];\n            S[i] = S[j];\n            S[j] = temp;\n\n            // Generate keystream byte\n            int keystreamByte = S[(S[i] + S[j]) % 256];\n\n            // XOR the data byte with the keystream byte\n            result[k] = (byte) (data[k] ^ keystreamByte);\n        }\n\n        return result;\n    }\n\n    /**\n     * Helper method to convert a byte array into a readable Hex string.\n     */\n    private static String bytesToHex(byte[] bytes) {\n        StringBuilder sb = new StringBuilder();\n        for (byte b : bytes) {\n            sb.append(String.format(\"%02X \", b));\n        }\n        return sb.toString().trim();\n    }\n\n    // --- Example Usage ---\n    public static void main(String[] args) {\n        byte[] secretKey = \"MySecretKey\".getBytes(StandardCharsets.UTF_8);\n        byte[] plaintext = \"Hello, World!\".getBytes(StandardCharsets.UTF_8);\n\n        System.out.println(\"Original: \" + new String(plaintext, StandardCharsets.UTF_8));\n\n        // 1. Encrypting the plaintext\n        byte[] ciphertext = rc4(secretKey, plaintext);\n        System.out.println(\"Ciphertext (Hex): \" + bytesToHex(ciphertext));\n\n        // 2. Decrypting back (same function, same key)\n        byte[] decryptedText = rc4(secretKey, ciphertext);\n        System.out.println(\"Decrypted: \" + new String(decryptedText, StandardCharsets.UTF_8));\n    }\n}", "out": "Original: Hello, World!\nCiphertext (Hex): 49 63 BA ED B7 A4 19 0B D2 AE AB 27 7D\nDecrypted: Hello, World!"}];
const nav=document.getElementById("nav"),main=document.getElementById("main");
D.forEach((d,i)=>{
 const a=document.createElement("a");a.href="#p"+i;a.textContent=d.week+": "+d.file;nav.appendChild(a);
 const s=document.createElement("section");s.id="p"+i;
 const hd=document.createElement("div");hd.className="hd";
 const b=document.createElement("b");b.textContent="Question "+d.n+" · "+d.week;
 const h=document.createElement("h2");h.textContent=d.q;hd.append(b,h);
 const bar=document.createElement("div");bar.className="bar";
 const l=document.createElement("span");l.textContent=d.file+" ("+d.lang+")";bar.appendChild(l);
 const r=document.createElement("span");
 const cp=document.createElement("button");cp.textContent="Copy code";
 cp.onclick=()=>{const t=document.createElement("textarea");t.value=d.code;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove();cp.textContent="Copied";setTimeout(()=>cp.textContent="Copy code",1200)};
 r.appendChild(cp);
 if(d.lang.startsWith("HTML")){const run=document.createElement("button");run.textContent="Run live";
  run.onclick=()=>{let f=s.querySelector("iframe");if(f){f.remove();return}f=document.createElement("iframe");f.srcdoc=d.code;s.appendChild(f)};r.appendChild(run)}
 bar.appendChild(r);
 const c=document.createElement("pre");c.className="code";c.textContent=d.code;
 const lab=document.createElement("div");lab.className="lab";lab.textContent="Output";
 const o=document.createElement("pre");o.className="out";o.textContent=d.out;
 s.append(hd,bar,c,lab,o);main.appendChild(s);
});
const links=[...nav.children];
addEventListener("scroll",()=>{let k=0;D.forEach((_,i)=>{if(document.getElementById("p"+i).getBoundingClientRect().top<150)k=i});links.forEach((a,i)=>a.classList.toggle("on",i==k))});
</script></body></html>
